<!DOCTYPE html>
<html lang="en" class="branchOrderPage orderPageEntering">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>L&amp;K Daily Branch Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+Khmer:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/customer-menu.css">
</head>
<body>
  <main id="branchPageMount"><p style="padding:24px;text-align:center;font:600 14px Inter,sans-serif;color:#6b5f52">Loading daily menu…</p></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script type="module">
    const response = await fetch('/', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load the menu.');
    const source = await response.text();
    const sourceDocument = new DOMParser().parseFromString(source, 'text/html');
    const app = sourceDocument.querySelector('.app');
    if (!app) throw new Error('Menu shell is unavailable.');
    document.getElementById('branchPageMount').replaceWith(app);
    await import('./assets/js/customer-menu.js');
  </script>
</body>
</html>
