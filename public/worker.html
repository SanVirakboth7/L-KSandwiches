<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Branch worker dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/worker-dashboard.css?v=worker-7">
</head>
<body>
  <main class="workerAuth" id="workerAuth" hidden>
    <form class="workerAuthCard" id="workerAuthForm">
      <span class="workerEyebrow">បុគ្គលិកសាខា L&amp;K</span>
      <h1>ចូលប្រើប្រាស់</h1>
      <p>សូមចូលដោយគណនី L&amp;K ដើម្បីកែប្រែស្តុកសាខា</p>
      <input type="email" id="workerEmail" autocomplete="username" placeholder="អ៊ីមែល" required>
      <input type="password" id="workerPassword" autocomplete="current-password" placeholder="ពាក្យសម្ងាត់" required>
      <button type="submit" id="workerAuthBtn">ចូលប្រើប្រាស់</button>
      <small id="workerAuthError"></small>
    </form>
  </main>
  <main class="workerShell" hidden>
    <header class="workerHeader">
      <div>
        <span class="workerEyebrow">បុគ្គលិកសាខា L&amp;K</span>
        <h1 id="workerBranchName">Branch dashboard</h1>
      </div>
    </header>
    <section class="workerSummary">
      <div><strong id="workerItemCount">0</strong><span>មុខម្ហូប</span></div>
      <div><strong id="workerPortionCount">0</strong><span>ចំនួននៅសល់</span></div>
      <button type="button" id="workerRefreshBtn" aria-label="Refresh stock">↻</button>
    </section>
    <section class="workerOrderPanel">
      <div class="workerPanelHead">
        <div><span class="workerEyebrow">ម៉ឺនុយថ្ងៃនេះ</span></div>
        <span id="workerUpdatedAt">Updating…</span>
      </div>
      <div class="workerMenuList" id="workerMenuList"><p class="workerEmpty">Loading menu…</p></div>
    </section>
    <section class="workerSubmitBar">
      <div><small class="workerOrderTotal" id="workerOrderTotal">សរុប ៛0 · $0.00</small></div>
      <button type="button" class="workerSubmitBtn" id="workerSubmitBtn" disabled>បញ្ជូនការលក់</button>
    </section>
    <p class="workerNotice" id="workerNotice" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script type="module" src="assets/js/worker-dashboard.js?v=supabase-umd-1"></script>
</body>
</html>
