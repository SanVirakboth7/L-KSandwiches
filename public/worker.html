<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Branch worker dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/worker-dashboard.css?v=worker-18">
</head>
<body>
  <main class="workerAuth" id="workerAuth" hidden>
    <form class="workerAuthCard" id="workerAuthForm">
      <span class="workerEyebrow">បុគ្គលិកសាខា L&amp;K</span>
      <h1>ចូលប្រើប្រាស់</h1>
      <p>សូមចូលដោយគណនី L&amp;K ដើម្បីកែប្រែស្តុកសាខា</p>
      <input type="email" id="workerEmail" autocomplete="username" placeholder="អ៊ីមែល" required>
      <input type="password" id="workerPassword" autocomplete="current-password" placeholder="ពាក្យសម្ងាត់" required>
      <button type="submit" id="workerAuthBtn">ចូលប្រើប្រាស់</button>
      <small id="workerAuthError"></small>
    </form>
  </main>
  <main class="workerShell" hidden>
    <header class="workerHeader">
      <div>
        <span class="workerEyebrow">បុគ្គលិកសាខា L&amp;K</span>
        <h1 id="workerBranchName">Branch dashboard</h1>
      </div>
      <button type="button" class="workerQrBtn" id="workerQrBtn" aria-label="Show main website QR code" title="Main website QR">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2v2h-2zM18 18h2v2h-2z"/></svg>
      </button>
    </header>
      <section class="workerSummary">
        <div><strong id="workerItemCount">0</strong><span>មុខម្ហូប</span></div>
        <div><strong id="workerPortionCount">0</strong><span>ចំនួននៅសល់</span></div>
        <button type="button" id="workerRefreshBtn" aria-label="Refresh stock">↻</button>
      </section>
    <section class="workerOrderPanel">
      <div class="workerPanelHead">
        <div><span class="workerEyebrow">ម៉ឺនុយថ្ងៃនេះ</span></div>
        <span id="workerUpdatedAt">Updating…</span>
      </div>
      <div class="workerMenuList" id="workerMenuList"><p class="workerEmpty">Loading menu…</p></div>
    </section>
    <section class="workerSubmitBar">
      <div><small class="workerOrderTotal" id="workerOrderTotal">សរុប ៛0 · $0.00</small></div>
      <div class="workerSubmitActions">
        <button type="button" class="workerSubmitBtn" id="workerSubmitBtn" disabled>បញ្ជូនការលក់</button>
        <button type="button" class="workerClearBtn" id="workerClearBtn" aria-label="Clear selected quantities" title="Clear selection" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>
        </button>
      </div>
    </section>
    <p class="workerNotice" id="workerNotice" aria-live="polite"></p>
    <div class="workerSuccessToast" id="workerSuccessToast" role="status" aria-label="Order submitted successfully" aria-live="polite" hidden>
      <svg class="workerSuccessCheck" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
    </div>
  </main>
  <div class="workerQrOverlay" id="workerQrOverlay" hidden>
    <div class="workerQrCard" role="dialog" aria-modal="true" aria-labelledby="workerQrTitle">
      <button type="button" class="workerQrClose" id="workerQrClose" aria-label="Close QR popup">&times;</button>
      <h2 id="workerQrTitle">L&amp;K Sandwiches</h2>
      <p>Scan to open the L&amp;K Sandwiches menu.</p>
      <img id="workerQrImage" src="" alt="QR code for the main website">
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script type="module" src="assets/js/worker-dashboard.js?v=supabase-umd-3"></script>
</body>
</html>
